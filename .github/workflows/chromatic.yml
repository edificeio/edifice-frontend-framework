name: "Chromatic"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - develop
      - develop*
      - epic-*
    # Only run Chromatic when a change can actually affect the Storybook build.
    # apps/docs (Storybook) depends on: react -> bootstrap, extensions, utilities, client, config.
    # packages/cli and packages/rest-client-base are NOT part of that dependency graph.
    # If a new workspace package joins that graph, add its path here too.
    paths:
      - "apps/docs/**"
      - "packages/react/**"
      - "packages/bootstrap/**"
      - "packages/extensions/**"
      - "packages/client/**"
      - "packages/utilities/**"
      - "packages/config/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/chromatic.yml"
  workflow_dispatch:

concurrency:
  # Cancel a build made obsolete by a newer push on the same PR/branch while it's still running.
  group: chromatic-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    name: Run Chromatic
    runs-on: ubuntu-latest
    env:
      # Required for TurboSnap to correctly detect changed files on pull_request events.
      # See https://www.chromatic.com/docs/github-actions/
      CHROMATIC_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      CHROMATIC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CHROMATIC_SLUG: ${{ github.repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
      - name: Generate .npmrc
        run: |
          pnpm config set @edifice-ui:registry https://registry.npmjs.org
          pnpm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}
          pnpm config set auto-install-peers true
      - name: Install dependencies
        run: |
          pnpm install && pnpm run build
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Run Chromatic
        uses: chromaui/action@v18
        with:
          # ⚠️ Make sure to configure a `CHROMATIC_PROJECT_TOKEN` repository secret
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build
          workingDir: apps/docs
